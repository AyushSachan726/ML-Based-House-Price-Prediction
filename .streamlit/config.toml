[theme]
# Primary accent color for interactive elements, buttons, and highlights
primaryColor = "#2563EB"

# Background color for the main content area
backgroundColor = "#0F172A"

# Background color for sidebar and modal elements
secondaryBackgroundColor = "#1E293B"

# Color for text
textColor = "#F8FAFC"

# Font family ('sans serif', 'serif', or 'monospace')
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
